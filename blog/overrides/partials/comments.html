{% if page.meta.comments %}
  <h2 id="__comments">comments</h2>
  <!-- giscus — comments & reactions backed by GitHub Discussions.
       data-category-id comes from https://giscus.app after enabling
       Discussions on the repo and installing the giscus app. -->
  <script
    src="https://giscus.app/client.js"
    data-repo="NidPlays/nidplays.github.io"
    data-repo-id="MDEwOlJlcG9zaXRvcnkzNjMzODk5MDE="
    data-category="Blog Comments"
    data-category-id="GISCUS_CATEGORY_ID_PLACEHOLDER"
    data-mapping="pathname"
    data-strict="1"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="top"
    data-theme="transparent_dark"
    data-lang="en"
    data-loading="lazy"
    crossorigin="anonymous"
    async
  >
  </script>
{% endif %}
