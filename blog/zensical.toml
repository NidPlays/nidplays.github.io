# ============================================================================
# nidish@blog:~$ — Zensical configuration
# Docs: https://zensical.org/docs/
# ============================================================================

[project]
site_name = "nidish@blog:~$"
site_description = "Nidish's blog — notes on code, design and everything in between."
site_author = "Nidish"

# Canonical URL of the deployed blog. Update the domain if it changes —
# the /blog/ suffix must stay, since the blog is served under that path.
site_url = "https://portfolio.nidish.xyz/blog/"

copyright = """
Copyright &copy; 2026 Nidish &mdash; <a href="/">back to portfolio</a>
"""

nav = [
  { "~$ cat welcome.md" = "index.md" },
  { "posts" = [
    { "hello, world" = "posts/hello-world.md" },
  ] },
  { "← portfolio" = "/" },
  { "resume" = "/resume/" },
]

extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/giscus.js", "javascripts/header.js"]

[project.theme]
language = "en"

# Template overrides (currently: partials/comments.html for giscus)
custom_dir = "overrides"

features = [
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[project.theme.icon]
logo = "lucide/terminal"

[project.theme.font]
text = "JetBrains Mono"
code = "JetBrains Mono"

# Dark only — terminal blue. Custom colors live in stylesheets/extra.css.
[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/NidPlays"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/nidish-g/"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
